<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
  <title id="title">interactive-experience: decide what you are building first</title>
  <desc id="desc">A camera reads a moving person. A director decides the fork: an experience that makes people feel something, or a training tool that makes people better.</desc>
  <style>
    .bg{fill:#f5f5f5}.surface{fill:#ffffff}.canvas{fill:#ffffff}
    .hair{stroke:#e5e5e5}.strong{stroke:#cfcfcf}.strong-f{fill:#cfcfcf}.ink-s{stroke:#0a0a0a}.mut-s{stroke:#999999}
    .ink{fill:#0a0a0a}.ink2{fill:#3d3d3d}.muted{fill:#666666}.faint{fill:#999999}
    .acc{fill:#0062cc}.acc-s{stroke:#0062cc}.acc-soft{fill:#e8f0fa}
    text{font-family:"Outfit",-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    @media (prefers-color-scheme: dark){
      .bg{fill:#141414}.surface{fill:#111111}.canvas{fill:#0a0a0a}
      .hair{stroke:#262626}.strong{stroke:#3a3a3a}.strong-f{fill:#3a3a3a}.ink-s{stroke:#f2f2f2}.mut-s{stroke:#6b6b6b}
      .ink{fill:#f2f2f2}.ink2{fill:#d4d4d4}.muted{fill:#a3a3a3}.faint{fill:#6b6b6b}
      .acc{fill:#3b9cff}.acc-s{stroke:#3b9cff}.acc-soft{fill:#0f1f33}
    }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="420"/>

  <text class="faint mono" x="64" y="96" font-size="10" letter-spacing="1.5">INPUT · CAMERA / SENSORS</text>
  <g>
    <rect class="surface strong" x="64" y="186" width="56" height="38" rx="6" stroke-width="1.25"/>
    <circle class="canvas strong" cx="92" cy="205" r="11" stroke-width="1.25"/>
    <circle class="ink" cx="92" cy="205" r="4"/>
    <path class="strong" d="M120 196 L170 160 M120 214 L170 262" fill="none" stroke-width="1" stroke-dasharray="2 4"/>
  </g>
  <g transform="translate(214 248) scale(1.25)" fill="none" class="ink-s" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="-58" r="10"/>
    <path d="M0 -46 L4 0"/>
    <path d="M2 -36 L-30 -50 M2 -36 L28 -60"/>
    <path d="M4 0 L18 40 M4 0 L-22 38"/>
  </g>
  <path class="mut-s" d="M268 212 H404" fill="none" stroke-width="1.25" stroke-dasharray="3 5" stroke-linecap="round"/>
  <g transform="translate(440 212)">
    <rect class="acc" x="-26" y="-26" width="52" height="52" rx="6" transform="rotate(45)"/>
    <text x="0" y="5" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="600">?</text>
  </g>
  <text class="faint mono" x="440" y="282" font-size="10" letter-spacing="1.5" text-anchor="middle">DIRECTOR</text>
  <text class="ink2 mono" x="440" y="298" font-size="11" text-anchor="middle">decide which first</text>
  <path class="acc-s" d="M477 200 C 540 200, 560 120, 620 120" fill="none" stroke-width="1.5"/>
  <path class="acc-s" d="M477 224 C 540 224, 560 304, 620 304" fill="none" stroke-width="1.5"/>
  <circle class="acc" cx="620" cy="120" r="3"/><circle class="acc" cx="620" cy="304" r="3"/>
  <g>
    <rect class="surface hair" x="632" y="44" width="504" height="152" rx="8" stroke-width="1"/>
    <text class="faint mono" x="656" y="72" font-size="10" letter-spacing="1.5">① EXPERIENCE</text>
    <text class="ink" x="656" y="100" font-size="20" font-weight="500" letter-spacing="-0.3">Make people feel something</text>
    <text class="muted" x="656" y="124" font-size="13">Installations · projection · stage · experience apps</text>
    <text class="faint mono" x="656" y="176" font-size="10" letter-spacing="1">5,000–8,000 LM · &lt;100 MS</text>
    <circle class="acc-s" cx="1046" cy="120" r="18" fill="none" stroke-width="1.5"/>
    <circle class="strong" cx="1046" cy="120" r="34" fill="none" stroke-width="1"/>
    <circle class="strong" cx="1046" cy="120" r="50" fill="none" stroke-width="1"/>
    <circle class="strong" cx="1046" cy="120" r="66" fill="none" stroke-width="1"/>
  </g>
  <g transform="translate(1046 146) scale(0.62)" fill="none" class="ink-s" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="-58" r="10"/>
    <path d="M0 -46 L4 0"/>
    <path d="M2 -36 L-26 -50 M2 -36 L28 -74"/>
    <path d="M4 0 L20 40 M4 0 L-16 38"/>
  </g>
  <g>
    <rect class="surface hair" x="632" y="228" width="504" height="152" rx="8" stroke-width="1"/>
    <text class="faint mono" x="656" y="256" font-size="10" letter-spacing="1.5">② TRAINING TOOL</text>
    <text class="ink" x="656" y="284" font-size="20" font-weight="500" letter-spacing="-0.3">Make people better</text>
    <text class="muted" x="656" y="308" font-size="13">Form evaluation · practice design · instructors</text>
    <text class="faint mono" x="656" y="360" font-size="10" letter-spacing="1">ONE CAMERA · ONE TECHNIQUE · REVIEW AFTER</text>
  </g>
  <g transform="translate(1030 340) scale(0.75)" fill="none" class="strong" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="-58" r="10"/>
    <path d="M0 -46 L4 0"/>
    <path d="M2 -36 L-30 -50 M2 -36 L28 -40"/>
    <path d="M4 0 L18 40 M4 0 L-22 38"/>
  </g>
  <g transform="translate(1030 340) scale(0.75)" fill="none" class="ink-s" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="-58" r="10"/>
    <path d="M0 -46 L4 0"/>
    <path d="M2 -36 L-30 -50 M2 -36 L28 -58"/>
    <path d="M4 0 L22 40 M4 0 L-22 38"/>
  </g>
  <path class="acc-s" d="M1051 310 L1051 299" fill="none" stroke-width="1.5" stroke-linecap="round"/>
  <circle class="acc" cx="1051" cy="296.5" r="3.5"/>
  <text class="acc mono" x="1062" y="300" font-size="10">fix</text>
</svg>
